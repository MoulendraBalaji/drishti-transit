<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Drishti-Transit (दृष्टि-ट्रांसिट) — National Urban Intelligence Network | MoRTH & Smart Cities Mission, Government of India.">
  <meta name="theme-color" content="#090E17">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drishti-Transit">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Drishti-Transit | Government of India — Urban Edge Intelligence</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      background-color: #090E17;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: light) {
      body {
        background-color: #F4F6F9;
      }
    }
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      background: radial-gradient(circle at 50% 20%, rgba(255, 153, 51, 0.12), transparent 45%),
                  radial-gradient(circle at 50% 80%, rgba(19, 136, 8, 0.12), transparent 45%),
                  #090E17;
      color: #F1F5F9;
    }
    @media (prefers-color-scheme: light) {
      #loading {
        background: radial-gradient(circle at 50% 20%, rgba(255, 153, 51, 0.08), transparent 45%),
                    radial-gradient(circle at 50% 80%, rgba(19, 136, 8, 0.08), transparent 45%),
                    #F4F6F9;
        color: #0F172A;
      }
      .loading-text {
        color: #0F172A !important;
      }
      .spinner {
        border-color: rgba(0, 0, 0, 0.1) !important;
      }
    }
    .gov-flag-bar {
      display: flex;
      width: 120px;
      height: 3.5px;
      margin-bottom: 24px;
      border-radius: 2px;
      overflow: hidden;
    }
    .gov-flag-bar .saffron { flex: 1; background: #FF9933; }
    .gov-flag-bar .white { flex: 1; background: #FFFFFF; }
    .gov-flag-bar .green { flex: 1; background: #138808; }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3.5px solid rgba(255, 255, 255, 0.12);
      border-top: 3.5px solid #FF9933;
      border-bottom: 3.5px solid #138808;
      border-right: 3.5px solid #00F5D4;
      border-radius: 50%;
      animation: spin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .gov-title {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      color: #FF9933;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .loading-text {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: #F1F5F9;
      text-transform: uppercase;
    }
    .gov-sub {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.05em;
      color: #8899AC;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="gov-flag-bar">
      <div class="saffron"></div>
      <div class="white"></div>
      <div class="green"></div>
    </div>
    <div class="spinner"></div>
    <div class="gov-title">भारत सरकार · GOVERNMENT OF INDIA</div>
    <div class="loading-text">DRISHTI-TRANSIT · दृष्टि-ट्रांसिट</div>
    <div class="gov-sub">MoRTH · Smart Cities Mission · AIS-140 Edge Radar</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
