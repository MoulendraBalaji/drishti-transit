name: Publish Release

# Builds the Android APK and iOS IPA and publishes them to a GitHub Release.
#
# Triggers:
#   - pushing a tag like `v1.0.0`  ->  creates a draft release for that tag
#   - manual run (Actions > Publish Release > Run workflow)
#
# Optional signed iOS/IPA:
#   Add the repo secrets CERTIFICATE_BASE64, CERTIFICATE_PASSWORD,
#   IOS_DISTRIBUTION_PROFILE_BASE64 and set SIGN_IOS == 'true'. Without them
#   the workflow exports an unsigned IPA (--no-codesign), which is fine for
#   test-flight/demo artifacts but not for App Store distribution.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to use (e.g. v0.1.0). Leave empty for a manual build.'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  library-check:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  android:
    name: Build Android APK
    needs: library-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha1
          if-no-files-found: error

  ios:
    name: Build iOS IPA
    needs: library-check
    runs-on: macos-14
    env:
      SIGN_IOS: ${{ secrets.SIGN_IOS }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Set up iOS signing keys
        if: env.SIGN_IOS == 'true'
        run: |
          mkdir -p ~/ios-certs
          echo "${{ secrets.CERTIFICATE_BASE64 }}" | base64 --decode > ~/ios-certs/cert.p12
          echo "${{ secrets.IOS_DISTRIBUTION_PROFILE_BASE64 }}" | base64 --decode > ~/ios-certs/profile.mobileprovision
          security create-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          security import ~/ios-certs/cert.p12 -k build.keychain -P "${{ secrets.CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${{ secrets.KEYCHAIN_PASSWORD }}" build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp ~/ios-certs/profile.mobileprovision \
            ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build IPA (signed)
        if: env.SIGN_IOS == 'true'
        run: flutter build ipa --release

      - name: Build IPA (unsigned)
        if: env.SIGN_IOS != 'true'
        run: flutter build ipa --no-codesign

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF#refs/tags/}"; fi
          if [ -z "$VERSION" ]; then VERSION="build-$(date +%Y%m%d-%H%M%S)"; fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Drishti-Transit ${{ steps.tag.outputs.version }}
          body: |
            Automated build for **Drishti-Transit**.

            - Android: `Drishti Transit` release APK (`app-release.apk`)
            - iOS: archive export (`*.ipa`)
          draft: true
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.apk.sha1
            release-assets/*.ipa
          fail_on_unmatched_files: true