name: Publish Release & Deploy

# Builds the Android APK and publishes to GitHub Releases,
# and builds Flutter Web and deploys to GitHub Pages.
#
# Triggers:
#   - push to main branch
#   - pushing a tag like `v1.0.0`
#   - manual run (workflow_dispatch)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to use (e.g. v1.0.4). Leave empty to use pubspec version.'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  library-check:
    name: Analyze + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  web:
    name: Build Web App
    needs: library-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Build Web App
        run: flutter build web --release --base-href "/drishti-transit/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  android:
    name: Build Android APK
    needs: library-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Restore dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-release.apk.sha1
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) VERSION="${GITHUB_REF#refs/tags/}" ;;
              *) VERSION="" ;;
            esac
          fi
          if [ -z "$VERSION" ]; then
            PUBSPEC_VER=$(grep '^version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1 | tr -d '\r\n[:space:]')
            if [ -n "$PUBSPEC_VER" ]; then
              VERSION="v${PUBSPEC_VER}"
            else
              VERSION="build-$(date +%Y%m%d-%H%M%S)"
            fi
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          name: Drishti-Transit ${{ steps.tag.outputs.version }}
          body: |
            Automated production release for **Drishti-Transit (दृष्टि-ट्रांसिट)** — National Urban Edge Intelligence Network.

            - **Android Release APK**: `app-release.apk`
            - **Live Web App**: Deployed directly via GitHub Pages at [https://moulendrabalaji.github.io/drishti-transit/](https://moulendrabalaji.github.io/drishti-transit/)
          draft: false
          generate_release_notes: true
          files: |
            release-assets/*.apk
            release-assets/*.apk.sha1
          fail_on_unmatched_files: false